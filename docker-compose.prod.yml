# Production-style stack: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Required in .env.prod: POSTGRES_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, DATA_ENCRYPTION_KEY,
# WEB_ORIGIN (e.g. https://lexisora.hrms.app), SMTP_* for real mail.
name: lexisora-hrms-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hrms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://hrms:${POSTGRES_PASSWORD}@postgres:5432/hrms?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/storage
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Lexisora HRMS <no-reply@lexisora.hrms.app>}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - storage:/data/storage

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "8025:8025"

volumes:
  pgdata:
  storage:
